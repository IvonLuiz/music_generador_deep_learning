task:
  family: "vqvae"
  variant: "single"
  name: "vq_vae_maestro_audio_aug"

dataset:
  input_mode: "audio" # "spectrogram" uses saved .npy files; "audio" reads raw audio and builds mel specs on GPU
  raw_path: /home/ivon/code/datasets/raw/maestro-v3.0.0/
  metadata_path: /home/ivon/code/datasets/raw/maestro-v3.0.0/maestro-v3.0.0.csv
  processed_path: /home/ivon/code/datasets/processed/maestro/
  spectrogram_type: "mel"
  n_mels: 256
  sample_rate: 22050
  hop_length: 256
  frame_size: 2048
  target_time_frames: 256
  splits:
    include_test_in_train: false
  audio:
    examples_per_file: 32
    downmix:
      enabled: true
      weight_range: [0.0, 1.0]
    pitch_shift:
      enabled: true
      semitone_choices: [-3, -2, -1, 0, 1, 2, 3]
      semitone_range: [-3.0, 3.0]
    resample_lowpass_filter_width: 64
    resample_chunk_size: 8192
    max_torchaudio_resample_factor: 256
    extensions: [".wav", ".flac", ".aiff", ".aif"]

model:
  name: "vq_vae_maestro_audio_aug"
  use_residual: true
  K: 1024
  D: 512
  conv_filters: [64, 128, 256, 512]
  conv_kernels: [3, 3, 3, 3]
  conv_strides: [[2, 2], [2, 2], [2, 2], [2, 1]]
  dropout_rate: 0.0

training:
  seed: 42
  batch_size: 128
  gradient_accumulation_steps: 2
  learning_rate: 0.0001
  weight_decay: 0.00001
  epochs: 500
  validation_split: 0.2
  save_dir: "./models/vq_vae/"
  num_workers: 8
  pin_memory: true
  persist_workers: true
  prefetch_factor: 4
  amp: true
  max_grad_norm: 1.0
  data_variance_samples: 1000

resume:
  enabled: true
  checkpoint_path: "./models/vq_vae/2026-05-31_04-02-06/model.pth"
  reset_optimizer: false
  reset_scheduler: false

callbacks:
  early_stopping_patience: 20
  save_every: 0
  save_samples: true
  sample_count: 4

testing:
  specific_run_dir: null
  weights_file_choice: "best_model.pth"
