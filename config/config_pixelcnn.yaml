task:
  family: "pixelcnn"
  variant: "single"
  name: "pixelcnn_maestro_vqvae"

dataset:
  input_mode: "quantized"
  quantized_path: "/home/ivon/code/datasets/processed/maestro_vqvae_quantized"
  manifest_file: "pixelcnn_quantized_manifest.jsonl"
  splits:
    train: ["train"]
    validation: ["validation"]
    include_test_in_train: true
  window_parity:
    train_mode: "alternate" # "alternate", "random_per_song", or "all"
    validation: "even"
  preload: false

model:
  name: "pixelcnn_maestro_vqvae"
  K: 1024
  hidden_channels: 128
  num_layers: 15
  kernel_size: 5
  dropout_rate: 0.0

training:
  seed: 42
  batch_size: 256
  gradient_accumulation_steps: 1
  learning_rate: 0.001
  epochs: 200
  save_dir: "./models/"
  validation_split: 0.2
  num_workers: 4
  pin_memory: true
  persist_workers: true
  prefetch_factor: 4
  amp: true
  max_grad_norm: 1.0

resume:
  enabled: false
  checkpoint_path: null
  reset_optimizer: false
  reset_scheduler: false

callbacks:
  early_stopping_patience: 10
  save_every: 10
  save_samples: false
