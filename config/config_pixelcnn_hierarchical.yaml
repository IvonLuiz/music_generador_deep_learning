task:
  family: "pixelcnn"
  variant: "two_level"
  name: "pixelcnn_maestro2011"

dataset:
  input_mode: "quantized"
  quantized_path: "./data/processed/hierarchical_vqvae_quantized/"
  manifest_file: "pixelcnn_quantized_manifest.jsonl"
  splits:
    train: ["train"]
    validation: ["validation"]
    include_test_in_train: true
  window_parity:
    train_mode: "alternate"
    validation: "even"
  preload: false

model:
  name: "pixelcnn_maestro2011"
  num_prior_levels: 2
  two_level_conditioning_mode: "deconv"

priors:
  top_prior:
    hidden_channels: 128
    num_layers: 15
    conv_filter_size: 5
    dropout_rate: 0.1
  bottom_prior:
    hidden_channels: 128
    num_layers: 15
    conv_filter_size: 5
    dropout_rate: 0.1

training:
  seed: 42
  batch_size: 32
  gradient_accumulation_steps: 1
  learning_rate: 0.0003
  epochs: 50
  save_dir: "./models/"
  validation_split: 0.2
  num_workers: 4
  pin_memory: true
  persist_workers: true
  prefetch_factor: 4
  amp: true
  max_grad_norm: 1.0

resume:
  enabled: false
  checkpoint_path: null
  reset_optimizer: false
  reset_scheduler: false

callbacks:
  early_stopping_patience: 10
  save_every: 10
  save_samples: false
